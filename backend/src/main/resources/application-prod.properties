spring.application.name=convivium
spring.main.allow-bean-definition-overriding=true
# JWT e CORS: use variáveis de ambiente no Render (JWT_SECRET, JWT_EXPIRATION, APP_FRONTEND_URL)
jwt.secret=${JWT_SECRET:usersecret}
jwt.expiration=${JWT_EXPIRATION:7200000}
server.servlet.context-path=/convivium
server.port=${PORT:8481}

# CORS: no Render defina APP_FRONTEND_URL (ex: https://convivium-front.onrender.com)
app.frontend.url=${APP_FRONTEND_URL:https://convivium-front.onrender.com}

spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.show_sql=false
# Atualiza schema automaticamente ao subir (cria novas tabelas/colunas no banco existente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.datasource.initialization-mode=never
spring.jpa.hibernate.globally_quoted_identifiers=true
# Schema padrão para compatibilidade com tabelas existentes
spring.jpa.properties.hibernate.default_schema=convivium

# ===============================
# PostgreSQL - use variáveis de ambiente no Render
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/convivium}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:convivium}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# HikariCP - Connection Pool
# ===============================
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=PostgreSQLHikariCP

# Upload: no Render o disco é efêmero; use diretório temporário
app.upload.dir=${APP_UPLOAD_DIR:uploads}
spring.mail.host=smtp.maileroo.com
spring.mail.port=587
